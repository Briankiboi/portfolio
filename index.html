    <!-- Hero safety net: if WebGL is unavailable or the context is lost
         (some phones), hide the rendering canvas so the hero keeps showing
         the poster background instead of an empty white block. -->
    <script>
      (function () {
        function hasWebGL() {
          try {
            var c = document.createElement('canvas');
            return !!(
              c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')
            );
          } catch (e) {
            return false;
          }
        }
        function flag() {
          document.documentElement.classList.add('bk-no-webgl');
        }
        if (!hasWebGL()) {
          flag();
        } else {
          document.addEventListener(
            'webglcontextlost',
            function (e) {
              if (e.target instanceof HTMLCanvasElement) flag();
            },
            true
          );
        }
      })();
    </script>
